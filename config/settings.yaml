system:
  name: loony-trading
  version: "1.1.0"
  mode: paper              # live | paper | backtest
  primary_market: upstox   # upstox | binance  — upstox is primary
  log_level: INFO
  timezone: Asia/Kolkata   # IST for Indian markets

exchanges:
  # ── Upstox (Primary — Indian Markets) ──────────────────────────────────────
  upstox:
    api_key: "${UPSTOX_API_KEY}"
    api_secret: "${UPSTOX_API_SECRET}"
    redirect_uri: "${UPSTOX_REDIRECT_URI}"
    access_token: "${UPSTOX_ACCESS_TOKEN}"   # pre-obtained token (optional)
    token_file: "data/upstox_token.json"
    auth_port: 3561           # local port for OAuth redirect capture
    default_product: "CNC"    # CNC | MIS | NRML

  # ── Binance (Secondary — Crypto) ───────────────────────────────────────────
  binance:
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    sandbox: true
    rate_limit: 1200

  alpaca:
    api_key: "${ALPACA_API_KEY}"
    api_secret: "${ALPACA_API_SECRET}"
    base_url: "${ALPACA_BASE_URL}"

# ── Indian Market Assets (Upstox) ──────────────────────────────────────────
assets:
  india_equity:
    - RELIANCE
    - TCS
    - HDFCBANK
    - INFY
    - ICICIBANK
    - SBIN
    - BAJFINANCE
    - BHARTIARTL
    - KOTAKBANK
    - LT
    - AXISBANK
    - WIPRO
    - TATAMOTORS
    - HCLTECH
    - ITC

  india_indices:
    - NIFTY50
    - NIFTYBANK

  india_fo:                  # F&O instruments (instrument_key format or symbol)
    - NIFTY50                # will resolve to near-month futures/options
    - BANKNIFTY

  crypto:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT

timeframes:
  primary: 1d               # daily for equities
  intraday: 30m             # live bot's intraday bars. Not 15m: Upstox's historical API
                            # returns HTTP 400 for 5m/15m on this account (see scheduler note)
  secondary:
    - 15m
    - 1h
    - 1d

risk:
  max_risk_per_trade: 0.01       # 1% of portfolio per trade
  max_daily_drawdown: 0.05       # 5% max daily loss
  max_concurrent_trades: 10
  max_portfolio_risk: 0.20       # 20% total exposure
  stop_loss_atr_multiplier: 2.0
  take_profit_atr_multiplier: 3.0
  trailing_stop_pct: 0.02        # 2% trailing
  use_kelly_criterion: false
  kelly_fraction: 0.25           # fractional Kelly

execution:
  order_type: limit              # market | limit | smart
  slippage_pct: 0.0005           # 0.05% market impact (NSE liquid stocks)
  commission_intraday: 0.00055   # MIS round-trip ~0.055% total charges
  commission_delivery: 0.0021    # CNC round-trip ~0.21% total charges
  retry_attempts: 3              # ccxt (crypto) executor only — Upstox orders are never retried
  retry_delay_ms: 500
  latency_budget_ms: 100
  reconcile_interval_sec: 300    # live: compare bot positions with Upstox every 5 min
  max_tick_jump_pct: 0.20        # drop ticks moving >20% from the last price (corrupt data)

intraday:                        # live bot session rules (risk_manager/intraday_guard.py)
  entry_start: "09:30"           # no new MIS entries before this (skip the opening auction noise)
  entry_end: "14:45"             # ... or after this; MIS squareoff runs at 15:14
  max_trades_per_day: 20         # entries per day across all symbols (0 = no cap)
  max_trades_per_symbol: 3       # entries per symbol per day (0 = no cap)
  cooldown_minutes_after_stop: 30  # no re-entry into a symbol this long after a stop-out
  profit_lock_pct: 0.0           # halt new entries once day P&L ≥ this × capital (0 = off)
  kill_switch:
    flatten_on_daily_loss: true  # at −risk.max_daily_drawdown (realised + unrealised): close all, halt
  heartbeat_minutes: 5           # alert if no tick for this long during market hours
  record_bars: true              # save live 1-minute bars to data/live_bars/
  exchange_stops: false          # live: protect each position with an SL-M order at the broker

data:
  lookback_days: 365
  cache_dir: ./data/cache
  warmup_bars: 200

strategies:
  # Enabled list is derived from 2-year backtest (2024-05-28 → 2026-05-28) on
  # RELIANCE/TCS/HDFCBANK/INFY/ICICIBANK/SBIN. Strategies with consistent
  # negative Sharpe across all symbols are excluded. Weights are proportional
  # to cross-symbol median Sharpe (floor 0.5 for any included strategy).
  # Run scripts/tune_weights.py to update.
  enabled:
    - vwap_reversion        # Sharpe +3.1 on RELIANCE, +7.6 on ICICIBANK
    - bollinger_reversion   # Sharpe +2.2 on RELIANCE, best P&L single trade
    - donchian_breakout     # +₹15K on TCS, +₹6K on RELIANCE
    - zscore_reversion      # Sharpe +0.6/+2.6 on RELIANCE/ICICIBANK
    - rsi_momentum          # Most consistent: positive on 3/5 symbols
    - candle_patterns       # High frequency; positive on RELIANCE+SBIN
    - volume_momentum       # Sharpe +8.2 on RELIANCE, +3.9 on TCS
    - vix_strategy          # India VIX spike/divergence — NIFTY/BANKNIFTY only
    - gift_nifty_gap        # Pre-market GIFT Nifty gap — NIFTY/BANKNIFTY only, intraday
    - fii_dii               # Institutional flow bias — NIFTY/BANKNIFTY only
    - anchored_vwap         # Per-session VWAP bands mean-reversion
    - cumulative_delta      # Order flow imbalance (buy vs sell pressure)
    - volume_profile        # POC/VAH/VAL level trades
    # Excluded: ema_crossover (Sharpe -19), multi_tf_trend (needs multi-TF frames),
    #           rsi_mean_reversion (-16), sr_breakout (-8), macd_momentum (-7),
    #           range_breakout (-3), supertrend (0 trades on daily data)
  weights:
    vwap_reversion: 1.5
    bollinger_reversion: 1.2
    donchian_breakout: 1.2
    zscore_reversion: 1.0
    rsi_momentum: 1.0
    volume_momentum: 0.9
    candle_patterns: 0.7
    vix_strategy: 1.1      # macro signal — high quality when VIX regime fires
    gift_nifty_gap: 1.0    # intraday open window only; returns None otherwise
    fii_dii: 0.8           # daily flow bias; supporting signal weight
    anchored_vwap: 0.9     # intraday VWAP mean-reversion
    cumulative_delta: 0.8  # order flow; weaker on daily bars than intraday
    volume_profile: 0.8    # POC/VAH/VAL; effective on liquid NSE stocks

signal_engine:
  # Composite score weights (spec §17) — must sum to 1.0. `historical` is a
  # flat neutral placeholder until Phase 3's analogue engine backfills
  # HistoricalEvent; treat its weight as inert until then.
  weights:
    catalyst: 0.25
    technical: 0.20
    momentum: 0.15
    volume: 0.15
    historical: 0.10
    regime: 0.10
    risk: 0.05
  quality_gate:
    min_score: 70        # score AND confidence must clear this to be BULLISH/BEARISH
    min_confidence: 65
    watch_score: 50       # below min_score but above this -> WATCH, else NO_SIGNAL

regime_detection:
  adx_trend_threshold: 25
  adx_strong_threshold: 40
  volatility_high_pct: 0.03
  volatility_lookback: 20

ml:
  train_lookback_days: 180
  retrain_interval_hours: 24
  lstm:
    sequence_length: 60
    hidden_units: 128
    dropout: 0.2
    epochs: 50
    batch_size: 32
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
  lightgbm:
    num_leaves: 63
    n_estimators: 300
    learning_rate: 0.05
  reinforcement:
    enabled: false
    algorithm: PPO
    total_timesteps: 100000

portfolio:
  initial_capital: 500000      # ₹5,00,000 default for Indian markets
  base_currency: INR
  rebalance_interval_hours: 24
  correlation_limit: 0.7

# ── Scheduler (spec §55) ─────────────────────────────────────────────────────
# Opt-in: disabled by default so importing the dashboard app never silently
# starts hitting live APIs (tests, one-off local runs, etc.). Intervals are
# conservative relative to the spec's "every minute" guidance — a full-
# universe signal scan against a rate-limited broker API every 60s isn't
# realistic for every provider; tune per your API tier.
scheduler:
  enabled: false
  news_interval_seconds: 60            # spec: every 15-60s
  signal_interval_seconds: 300         # spec: every minute (loosened — see above)
  alert_interval_seconds: 300          # runs right after signal scoring
  market_hours_only: true              # news still runs after hours; signals/alerts don't
  historical_backfill_hour: 18         # IST, after market close + buffer
  historical_backfill_minute: 0
  historical_backfill_min_age_days: 7  # matches backfill_historical_events.py default
  ml_retrain_enabled: true             # weekly scripts/train_ml.py retrain; only replaces
  ml_retrain_day_of_week: sun          # models/ensemble.pkl if the new model beats the
  ml_retrain_hour: 6                   # baselines, and never enables ml_classifier
  ml_retrain_days: 730

  # ── Intraday track (docs/appendix/intraday-audit.md §6) ───────────────────────────────
  # Separate opt-in from the daily jobs above — both can run at once,
  # writing to Signal rows tagged with their own timeframe (Phase 5's
  # fix), so enabling this never changes what the daily-cadence pages show.
  # Always market-hours-gated regardless of market_hours_only, since an
  # intraday bar means nothing once the session is closed.
  intraday_enabled: false
  intraday_timeframe: "30m"              # NOT "15m" — see note below
  intraday_signal_interval_seconds: 900  # 15 min; UpstoxDataEngine caches
                                          # intraday fetches for ~1h, so this
                                          # mostly hits cache, not the API
  intraday_alert_interval_seconds: 900
  intraday_lookback_days: 5
  # Live verification during this fix found Upstox's v2 historical-candle
  # endpoint returning HTTP 400 for the 5-minute and 15-minute intervals
  # on this account (30m/60m work fine) — matches the "broken Upstox
  # 15-minute interval" note already in backfill_historical_events.py.
  # If your account's API access differs, "15m" matches
  # timeframes.intraday above and is the spec's original suggestion.

# ── India Market Calendar ────────────────────────────────────────────────────
india_market:
  open_time: "09:15"           # IST
  close_time: "15:30"          # IST
  pre_open: "09:00"
  amo_window_start: "17:00"    # After-market order window
  amo_window_end:   "08:59"
  auto_squareoff_time: "15:15" # MIS auto-squareoff (broker may differ)
  holidays:                    # NSE trading holidays (market closed these days)
    # 2025
    - "2025-01-26"  # Republic Day
    - "2025-02-26"  # Mahashivratri
    - "2025-03-14"  # Holi
    - "2025-03-31"  # Id-Ul-Fitr (Ramzan Id)
    - "2025-04-10"  # Shri Ram Navami
    - "2025-04-14"  # Dr. Baba Saheb Ambedkar Jayanti
    - "2025-04-18"  # Good Friday
    - "2025-05-01"  # Maharashtra Day
    - "2025-08-15"  # Independence Day
    - "2025-08-27"  # Ganesh Chaturthi
    - "2025-10-02"  # Mahatma Gandhi Jayanti / Dussehra
    - "2025-10-20"  # Diwali Laxmi Puja (Muhurat trading — short session)
    - "2025-10-21"  # Diwali Balipratipada
    - "2025-11-05"  # Prakash Gurpurb Sri Guru Nanak Dev Ji
    - "2025-12-25"  # Christmas
    # 2026
    - "2026-01-26"  # Republic Day
    - "2026-03-20"  # Holi
    - "2026-04-02"  # Shri Ram Navami
    - "2026-04-03"  # Good Friday
    - "2026-04-14"  # Dr. Baba Saheb Ambedkar Jayanti
    - "2026-04-22"  # Id-Ul-Fitr
    - "2026-05-01"  # Maharashtra Day
    - "2026-08-15"  # Independence Day
    - "2026-10-02"  # Mahatma Gandhi Jayanti
    - "2026-11-14"  # Diwali Laxmi Puja
    - "2026-12-25"  # Christmas

notifications:
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  email:
    enabled: false
    smtp_host: "${SMTP_HOST}"
    smtp_port: 587
    user: "${EMAIL_USER}"
    password: "${EMAIL_PASSWORD}"
    to: "${EMAIL_TO}"

dashboard:
  host: "0.0.0.0"
  port: 8000                # FastAPI; Vite dev server runs on 5163
  refresh_interval_sec: 5
