system:
  name: loony-trading
  version: "1.1.0"
  mode: paper              # live | paper | backtest
  primary_market: upstox   # upstox | binance  — upstox is primary
  log_level: INFO
  timezone: Asia/Kolkata   # IST for Indian markets

exchanges:
  # ── Upstox (Primary — Indian Markets) ──────────────────────────────────────
  upstox:
    api_key: "${UPSTOX_API_KEY}"
    api_secret: "${UPSTOX_API_SECRET}"
    redirect_uri: "${UPSTOX_REDIRECT_URI}"
    access_token: "${UPSTOX_ACCESS_TOKEN}"   # pre-obtained token (optional)
    token_file: "data/upstox_token.json"
    auth_port: 8888           # local port for OAuth redirect capture
    default_product: "CNC"    # CNC | MIS | NRML

  # ── Binance (Secondary — Crypto) ───────────────────────────────────────────
  binance:
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    sandbox: true
    rate_limit: 1200

  alpaca:
    api_key: "${ALPACA_API_KEY}"
    api_secret: "${ALPACA_API_SECRET}"
    base_url: "${ALPACA_BASE_URL}"

# ── Indian Market Assets (Upstox) ──────────────────────────────────────────
assets:
  india_equity:
    - RELIANCE
    - TCS
    - HDFCBANK
    - INFY
    - ICICIBANK
    - SBIN
    - BAJFINANCE
    - BHARTIARTL
    - KOTAKBANK
    - LT
    - AXISBANK
    - WIPRO
    - TATAMOTORS
    - HCLTECH
    - ITC

  india_indices:
    - NIFTY50
    - NIFTYBANK

  india_fo:                  # F&O instruments (instrument_key format or symbol)
    - NIFTY50                # will resolve to near-month futures/options
    - BANKNIFTY

  crypto:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT

timeframes:
  primary: 1d               # daily for equities
  intraday: 15m             # 15-min for intraday strategies
  secondary:
    - 15m
    - 1h
    - 1d

risk:
  max_risk_per_trade: 0.01       # 1% of portfolio per trade
  max_daily_drawdown: 0.05       # 5% max daily loss
  max_concurrent_trades: 10
  max_portfolio_risk: 0.20       # 20% total exposure
  stop_loss_atr_multiplier: 2.0
  take_profit_atr_multiplier: 3.0
  trailing_stop_pct: 0.02        # 2% trailing
  use_kelly_criterion: false
  kelly_fraction: 0.25           # fractional Kelly

execution:
  order_type: limit              # market | limit | smart
  slippage_pct: 0.0005           # 0.05% market impact (NSE liquid stocks)
  commission_intraday: 0.00055   # MIS round-trip ~0.055% total charges
  commission_delivery: 0.0021    # CNC round-trip ~0.21% total charges
  retry_attempts: 3
  retry_delay_ms: 500
  latency_budget_ms: 100

data:
  lookback_days: 365
  cache_dir: ./data/cache
  warmup_bars: 200

strategies:
  # Enabled list is derived from 2-year backtest (2024-05-28 → 2026-05-28) on
  # RELIANCE/TCS/HDFCBANK/INFY/ICICIBANK/SBIN. Strategies with consistent
  # negative Sharpe across all symbols are excluded. Weights are proportional
  # to cross-symbol median Sharpe (floor 0.5 for any included strategy).
  # Run scripts/tune_weights.py to update.
  enabled:
    - vwap_reversion        # Sharpe +3.1 on RELIANCE, +7.6 on ICICIBANK
    - bollinger_reversion   # Sharpe +2.2 on RELIANCE, best P&L single trade
    - donchian_breakout     # +₹15K on TCS, +₹6K on RELIANCE
    - zscore_reversion      # Sharpe +0.6/+2.6 on RELIANCE/ICICIBANK
    - rsi_momentum          # Most consistent: positive on 3/5 symbols
    - candle_patterns       # High frequency; positive on RELIANCE+SBIN
    - volume_momentum       # Sharpe +8.2 on RELIANCE, +3.9 on TCS
    - vix_strategy          # India VIX spike/divergence — NIFTY/BANKNIFTY only
    - gift_nifty_gap        # Pre-market GIFT Nifty gap — NIFTY/BANKNIFTY only, intraday
    - fii_dii               # Institutional flow bias — NIFTY/BANKNIFTY only
    - anchored_vwap         # Per-session VWAP bands mean-reversion
    - cumulative_delta      # Order flow imbalance (buy vs sell pressure)
    - volume_profile        # POC/VAH/VAL level trades
    # Excluded: ema_crossover (Sharpe -19), multi_tf_trend (needs multi-TF frames),
    #           rsi_mean_reversion (-16), sr_breakout (-8), macd_momentum (-7),
    #           range_breakout (-3), supertrend (0 trades on daily data)
  weights:
    vwap_reversion: 1.5
    bollinger_reversion: 1.2
    donchian_breakout: 1.2
    zscore_reversion: 1.0
    rsi_momentum: 1.0
    volume_momentum: 0.9
    candle_patterns: 0.7
    vix_strategy: 1.1      # macro signal — high quality when VIX regime fires
    gift_nifty_gap: 1.0    # intraday open window only; returns None otherwise
    fii_dii: 0.8           # daily flow bias; supporting signal weight
    anchored_vwap: 0.9     # intraday VWAP mean-reversion
    cumulative_delta: 0.8  # order flow; weaker on daily bars than intraday
    volume_profile: 0.8    # POC/VAH/VAL; effective on liquid NSE stocks

regime_detection:
  adx_trend_threshold: 25
  adx_strong_threshold: 40
  volatility_high_pct: 0.03
  volatility_lookback: 20

ml:
  train_lookback_days: 180
  retrain_interval_hours: 24
  lstm:
    sequence_length: 60
    hidden_units: 128
    dropout: 0.2
    epochs: 50
    batch_size: 32
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
  lightgbm:
    num_leaves: 63
    n_estimators: 300
    learning_rate: 0.05
  reinforcement:
    enabled: false
    algorithm: PPO
    total_timesteps: 100000

portfolio:
  initial_capital: 500000      # ₹5,00,000 default for Indian markets
  base_currency: INR
  rebalance_interval_hours: 24
  correlation_limit: 0.7

# ── India Market Calendar ────────────────────────────────────────────────────
india_market:
  open_time: "09:15"           # IST
  close_time: "15:30"          # IST
  pre_open: "09:00"
  amo_window_start: "17:00"    # After-market order window
  amo_window_end:   "08:59"
  auto_squareoff_time: "15:15" # MIS auto-squareoff (broker may differ)
  holidays:                    # NSE trading holidays (market closed these days)
    # 2025
    - "2025-01-26"  # Republic Day
    - "2025-02-26"  # Mahashivratri
    - "2025-03-14"  # Holi
    - "2025-03-31"  # Id-Ul-Fitr (Ramzan Id)
    - "2025-04-10"  # Shri Ram Navami
    - "2025-04-14"  # Dr. Baba Saheb Ambedkar Jayanti
    - "2025-04-18"  # Good Friday
    - "2025-05-01"  # Maharashtra Day
    - "2025-08-15"  # Independence Day
    - "2025-08-27"  # Ganesh Chaturthi
    - "2025-10-02"  # Mahatma Gandhi Jayanti / Dussehra
    - "2025-10-20"  # Diwali Laxmi Puja (Muhurat trading — short session)
    - "2025-10-21"  # Diwali Balipratipada
    - "2025-11-05"  # Prakash Gurpurb Sri Guru Nanak Dev Ji
    - "2025-12-25"  # Christmas
    # 2026
    - "2026-01-26"  # Republic Day
    - "2026-03-20"  # Holi
    - "2026-04-02"  # Shri Ram Navami
    - "2026-04-03"  # Good Friday
    - "2026-04-14"  # Dr. Baba Saheb Ambedkar Jayanti
    - "2026-04-22"  # Id-Ul-Fitr
    - "2026-05-01"  # Maharashtra Day
    - "2026-08-15"  # Independence Day
    - "2026-10-02"  # Mahatma Gandhi Jayanti
    - "2026-11-14"  # Diwali Laxmi Puja
    - "2026-12-25"  # Christmas

notifications:
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  email:
    enabled: false
    smtp_host: "${SMTP_HOST}"
    smtp_port: 587
    user: "${EMAIL_USER}"
    password: "${EMAIL_PASSWORD}"
    to: "${EMAIL_TO}"

dashboard:
  host: "0.0.0.0"
  port: 8501
  refresh_interval_sec: 5
