version: "3.9"

# ── Loony Trading — Docker Compose ────────────────────────────────────────────
# Quick start:
#   cp .env.example .env          # fill in your keys
#   docker compose up -d          # start everything
#   docker compose logs -f        # tail logs
#
# Services:
#   db         — Postgres (MarketPulse AI persistence layer, Phase 0+)
#   redis      — cache/pubsub, provisioned now, wired up in Phase 11
#   dashboard  — FastAPI backend + React SPA on :8000
#   bot        — paper/live trading bot (shares data volume with dashboard)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Postgres ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: loony-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-loony}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-loony}
      - POSTGRES_DB=${POSTGRES_DB:-loony_trading}
    ports:
      - "5432:5432"
    volumes:
      - loony-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loony}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: loony-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Dashboard + React SPA ─────────────────────────────────────────
  dashboard:
    build: .
    container_name: loony-dashboard
    restart: unless-stopped
    command: >
      uvicorn dashboard.backend.main:app
        --host 0.0.0.0
        --port 8000
        --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Upstox (Indian markets — primary)
      - UPSTOX_API_KEY=${UPSTOX_API_KEY}
      - UPSTOX_API_SECRET=${UPSTOX_API_SECRET}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI:-http://localhost:8888/callback}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN}
      # Telegram notifications
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Persistence + AI (Phase 0)
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-loony}:${POSTGRES_PASSWORD:-loony}@db:5432/${POSTGRES_DB:-loony_trading}
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-demo}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Trading Bot ────────────────────────────────────────────────────────────
  bot:
    build: .
    container_name: loony-bot
    restart: unless-stopped
    command: python scripts/paper_trade.py
    env_file:
      - .env
    environment:
      - UPSTOX_API_KEY=${UPSTOX_API_KEY}
      - UPSTOX_API_SECRET=${UPSTOX_API_SECRET}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI:-http://localhost:8888/callback}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-loony}:${POSTGRES_PASSWORD:-loony}@db:5432/${POSTGRES_DB:-loony_trading}
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-demo}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    depends_on:
      - dashboard
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,time,sys; s=json.load(open('data/live_positions.json')); sys.exit(0 if time.time()-s.get('saved_at',0)<300 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 60s

volumes:
  loony-pgdata:
